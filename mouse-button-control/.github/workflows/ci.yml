#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""Workflow for GitHub Actions CI/CD."""

name: CI

on:
  push:
    branches: [ main, develop, mouse-button-control ]
  pull_request:
    branches: [ main, develop, mouse-button-control ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd mouse-button-control
        pip install -r requirements.txt
        pip install -r .dev-requirements.txt
    
    - name: Lint with flake8
      run: |
        cd mouse-button-control
        flake8 mouse_button_control --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Test with pytest
      run: |
        cd mouse-button-control
        pytest --cov=mouse_button_control --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./mouse-button-control/coverage.xml
